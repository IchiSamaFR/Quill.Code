# Publication d'une version : pousser un tag vX.Y.Z (ex. git tag v0.1.0 && git push origin v0.1.0).
# Les paquets sont publies sur nuget.org ; une release GitHub en garde les notes. Tag vX.Y.Z-beta.N = pre-version.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # Trusted publishing nuget.org : jeton OIDC echange contre une cle d'API temporaire (1 h, usage unique).
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Tests
        run: dotnet test src/Quill.Code.slnx -c Release

      - name: Pack
        run: dotnet pack src/Quill.Code.slnx -c Release -p:Version=${{ steps.version.outputs.value }} -o artifacts

      # Juste avant le push : la cle temporaire expire au bout d'une heure. user = nom du profil nuget.org (pas l'e-mail), public.
      - name: Connexion nuget.org (trusted publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: IchiSamaFR

      - name: Publication nuget.org
        run: dotnet nuget push "artifacts/*.nupkg" --source "https://api.nuget.org/v3/index.json" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --skip-duplicate

      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
