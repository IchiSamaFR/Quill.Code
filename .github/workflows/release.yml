# Publishing a version: push a vX.Y.Z tag (e.g. git tag v0.1.0 && git push origin v0.1.0).
# Packages are published on nuget.org; a GitHub release keeps the notes. Tag vX.Y.Z-beta.N = pre-release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # nuget.org trusted publishing: OIDC token exchanged for a temporary API key (1 h, single use).
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Tests
        run: dotnet test src/Quill.Code.slnx -c Release

      - name: Pack
        run: dotnet pack src/Quill.Code.slnx -c Release -p:Version=${{ steps.version.outputs.value }} -o artifacts

      # Right before the push: the temporary key expires after one hour. user = nuget.org profile name (not the e-mail), public.
      - name: nuget.org login (trusted publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: IchiSamaFR

      # Without --skip-duplicate: nuget.org also answers 409 for a reserved prefix, the error must fail the job.
      - name: Publish to nuget.org
        run: dotnet nuget push "artifacts/*.nupkg" --source "https://api.nuget.org/v3/index.json" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"

      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
