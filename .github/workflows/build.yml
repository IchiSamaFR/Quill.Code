# Build and tests on each push / PR to master (publishing: release.yml, on tag).
name: Build

on:
  push:
    branches: [master]
    paths: ['src/**', '.github/workflows/build.yml']
  pull_request:
    paths: ['src/**', '.github/workflows/build.yml']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # SDK 10 for the tests; runtime 8 because the libraries target net8.0.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build
        run: dotnet build src/Quill.Code.slnx -c Release

      - name: Tests
        run: dotnet test src/Quill.Code.slnx -c Release --no-build
