# Build et tests a chaque push / PR sur master ; un push sur master publie aussi des paquets de pre-version
# (<VersionPrefix>-ci.<numero du run>) sur GitHub Packages, consommables sans attendre un tag.
name: Build

on:
  push:
    branches: [master]
    paths: ['src/**', '.github/workflows/build.yml']
  pull_request:
    paths: ['src/**', '.github/workflows/build.yml']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Lue par MSBuild comme propriete : build, tests et paquets portent la meme version.
      VersionSuffix: ${{ github.event_name == 'push' && format('ci.{0}', github.run_number) || '' }}
    steps:
      - uses: actions/checkout@v4

      # SDK 10 pour les tests ; runtime 8 car les librairies ciblent net8.0.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build
        run: dotnet build src/Quill.Code.slnx -c Release

      - name: Tests
        run: dotnet test src/Quill.Code.slnx -c Release --no-build

      - name: Pack
        if: github.event_name == 'push'
        run: dotnet pack src/Quill.Code.slnx -c Release --no-build -o artifacts

      - name: Publication GitHub Packages
        if: github.event_name == 'push'
        run: dotnet nuget push "artifacts/*.nupkg" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate
